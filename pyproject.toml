[project]
name = "invitedesk"
version = "0.1.0"
description = "InviteDesk - a multi-agent desk that runs guest/speaker outreach for an event"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-ai-slim[openai]>=2.54,<3",
    "openai>=3.0",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pypdf>=5.0",
]
