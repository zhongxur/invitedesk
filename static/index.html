<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InviteDesk</title>
  <meta name="description" content="InviteDesk — a multi-agent desk for guest, speaker and sponsor outreach. Humans approve everything; the desk never sends messages itself.">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
    <main class="main" id="main">
      <div id="banner"></div>
      <div id="view"><div class="loading"><span class="spinner"></span> Loading InviteDesk…</div></div>
    </main>
  </div>
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">InviteDesk needs JavaScript enabled.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
